# dsh-freeweb bundle layer: mount the freeweb plugin and route the web seam's
# search capability to it. The base layer (or an earlier bundle patch) pins
# `searchProvider` to some id; a patch row replaces the targeted row's whole
# config, and `searchProvider` is that row's only base key. A later profile
# patch can pin any provider back (e.g. modsearch).
- id: web
  config:
    searchProvider: freeweb
    # Re-declare the base's fetch provider: applyEntryPatches replaces the
    # whole `web` config on patch, so omitting this drops `fetchProvider`,
    # leaving the web seam with no configured provider and both `http` and
    # `deepseek-fetch-api` usable (WEB_PROVIDER_AMBIGUOUS). Pinning it keeps
    # fetch working and makes this layer self-contained.
    fetchProvider: http

- insert:
    - id: freeweb
      name: 'dsh-freeweb'
